name: CI

on:
  push:
  pull_request:

# Everything runs from app/ — the repo root is not a node project.
defaults:
  run:
    working-directory: app

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: eslint
        run: npx eslint .

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vitest
        run: npx vitest run

      - name: next build
        # Placeholders only. The build must not need real credentials, and CI
        # must never hold any: no API keys, no service-role key, no live
        # Supabase project.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  invariants:
    name: repo invariants (deterministic, no API spend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # a) every SC-*.answer-key.json validates against answer-key.schema.json
      # b) the schema copies vendored into src/ have not drifted from source
      # c) evaluator-calibration --fixtures-only is green
      # All three live in one locally-runnable script:
      #   cd app && npx tsx scripts/ci-invariants.ts
      - name: ci-invariants
        run: npx tsx scripts/ci-invariants.ts
